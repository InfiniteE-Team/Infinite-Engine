name: Infinite Engine Build

on:
  push:
  pull_request:

jobs:
  build:
    name: Build ${{ matrix.platform }}
    permissions: write-all
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
            target: windows
          - platform: Linux
            os: ubuntu-latest
            target: linux
          - platform: MacOS
            os: macos-15
            target: mac

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.4

      - name: Install hmm
        run: haxelib install hmm --quiet

      - name: Install dependencies via hmm
        run: haxelib run hmm install
        
      - name: Install System Dependencies (Linux)
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libluajit-5.1-dev luajit
          sudo apt-get install -y libvlc-dev libvlccore-dev
          sudo apt-get install -y libasound2-dev libgl1-mesa-dev libglu1-mesa-dev libx11-dev libxext-dev libxi-dev libxrandr-dev libxinerama-dev

      - name: Install LuaJIT (Mac)
        if: matrix.target == 'mac'
        run: brew install luajit

      - name: Setup Lime
        run: echo y | haxelib run lime setup

      - name: Build
        run: haxelib run lime build ${{ matrix.target }} -release