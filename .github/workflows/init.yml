name: Infinite Engine Build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: ubuntu-latest
            target: linux
          - os: macos-13
            target: mac

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.4

      - name: Install hmm
        run: haxelib install hmm --quiet

      - name: Install dependencies via hmm
        run: haxelib run hmm install

      - name: Install hxcpp
        run: haxelib install hxcpp --quiet

      - name: Install LuaJIT (Linux)
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libluajit-5.1-dev luajit

      - name: Install LuaJIT (Mac)
        if: matrix.target == 'mac'
        run: brew install luajit

      - name: Setup Lime
        run: echo y | haxelib run lime setup

      - name: Build
        run: haxelib run lime build ${{ matrix.target }} -release