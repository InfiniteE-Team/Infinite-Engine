name: Infinite Engine Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.platform }}
    permissions: write-all
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
            build_cmd: haxelib run lime build windows
            artifact_path: export/windows/bin

          - platform: Linux
            os: ubuntu-22.04
            build_cmd: haxelib run lime build linux
            artifact_path: export/linux/bin

          - platform: MacOS
            os: macos-15
            build_cmd: haxelib run lime build macos --app-version="4.0.0-${{ github.run_id}}"
            artifact_path: export/macos/bin

          - platform: MacOS x64
            os: macos-15-intel
            build_cmd: haxelib run lime build macos --app-version="4.0.0-${{ github.run_id}}"
            artifact_path: export/macos/bin

          - platform: Android
            os: ubuntu-latest
            build_cmd: haxelib run lime build android
            pre_build_commands: |
              haxelib run lime config ANDROID_SDK $ANDROID_HOME
              haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_LATEST_HOME
              haxelib run lime config JAVA_HOME $JAVA_HOME_17_X64
              haxelib run lime config ANDROID_SETUP true

    steps:
      - name: Pull the New Commit
        uses: actions/checkout@v4.1.7

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.7

      - name: Cache Haxelib
        uses: actions/cache@v4
        with:
          path: ~/haxelib
          key: haxelib-${{ runner.os }}-${{ hashFiles('**/hmm.json') }}
          restore-keys: haxelib-${{ runner.os }}-

      - name: Install Linux Dependencies
        if: matrix.platform == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libasound2-dev \
            libx11-dev \
            libxext-dev \
            libxi-dev \
            libxrandr-dev \
            libpulse-dev \
            libvlc-dev \
            libvlccore-dev \
            vlc

      - name: Install Main Libraries
        run: |
          haxelib --global git hmm https://github.com/ALE-Psych-Crew/hmm
          haxelib --global run hmm setup
          haxelib --global run hmm install
          haxelib run libhxcpp setup

      - name: Build Hxcpp Command-Line Tools
        run: |
          cd $(haxelib libpath libhxcpp)/tools/hxcpp
          haxe compile.hxml

      - name: Pre-Build Commands
        if: ${{ matrix.pre_build_commands }}
        run: ${{ matrix.pre_build_commands }}

      - name: Build for ${{ matrix.platform }}
        run: ${{ matrix.build_cmd }}

      - name: Upload Game
        if: matrix.platform != 'Android'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }} Build
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

      - name: Find APK
        if: matrix.platform == 'Android'
        id: find_apk
        run: |
          APK_PATH=$(find . -name "*.apk" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK found!"
            exit 1
          fi
          echo "path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload Android Build
        if: matrix.platform == 'Android'
        uses: actions/upload-artifact@v4
        with:
          name: Android Build
          path: ${{ steps.find_apk.outputs.path }}
          if-no-files-found: error
